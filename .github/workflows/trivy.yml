name: Trivy Docker Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire image Docker
        run: docker build -t vuln-web-proactif .

      - name: Scanner image avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vuln-web-proactif'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
